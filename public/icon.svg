<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="risolGrad" x1="14" y1="18" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Rounded Amber App Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="2" />

  <!-- Golden Crispy Risol Roll (Diagonal) -->
  <g transform="rotate(-24 32 33)">
    <rect x="11" y="22" width="42" height="22" rx="11" fill="url(#risolGrad)" stroke="#78350F" stroke-width="2.5" />
    <!-- Crispy Fold Lines & Breadcrumb Texture -->
    <path d="M21 23C19 28 19 38 21 43" stroke="#92400E" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <path d="M43 23C45 28 45 38 43 43" stroke="#92400E" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <path d="M27 29H37" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
    <path d="M25 35H39" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="31" r="1.3" fill="#B45309" />
    <circle cx="48" cy="34" r="1.3" fill="#B45309" />
    <circle cx="32" cy="26" r="1.2" fill="#B45309" />
  </g>

  <!-- Warm Steam / Aroma Lines -->
  <path d="M24 11C24 9 26 8 26 6" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M32 10C32 8 34 7 34 5" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M40 12C40 10 42 9 42 7" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
</svg>

